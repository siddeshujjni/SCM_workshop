resources:
  pipelines:
    scm_preferred_supplier_pipeline:
      name: Enbridge SCM - Preferred Supplier Pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.scm_pipeline_schema.name}

      libraries:
        - glob:
            include: ../src/pipeline/**

      root_path: ../src/pipeline
      serverless: true
      continuous: false
      photon: true
      channel: current

      configuration:
        volume_path: ${var.volume_path}
        volume_path_psl: ${var.volume_path_psl}

      permissions:
        - level: CAN_VIEW
          group_name: users